<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- cell 品牌标识：暗色圆角底板 + 浅灰「阶梯折线」（拐点落在 1/4、2/4、3/4 上）
       黑白灰配色，无彩色、无蓝光。本文件是应用图标（icon.ico）的栅格化来源；
       WebUI 内的品牌 logo 用同一组坐标，描边取 currentColor（随主题深浅），
       favicon（index.html 的 data URI）与本文件同形。 -->
  <rect x="10" y="10" width="480" height="480" rx="104" fill="#141416" stroke="#35353a" stroke-width="14" />

  <!-- 标识本体：与 WebUI 品牌 logo 同一组坐标（90..410），浅灰描边 -->
  <g fill="none" stroke="#e8e8ea" stroke-width="30" stroke-linejoin="miter" stroke-linecap="square">
    <rect x="90" y="90" width="320" height="320" />
    <path d="M 170 170 L 170 330 L 250 330 L 250 170 L 330 170 L 330 410" />
  </g>
</svg>
